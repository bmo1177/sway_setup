# tmux theme — generated with Matugen from the current wallpaper.
# Sourced by /etc/tmux.conf (see nixos/sway.nix). Regenerated by Super+W.

# Status bar
set -g status-style "bg=#16130b,fg=#cec6b4"
set -g status-left-length 40
set -g status-right-length 96
set -g status-left "#[bg=#e0c56d,fg=#3b2f00,bold] #S "
set -g status-right "#[fg=#abcfb0]#{cpu_percentage} #[fg=#4b4639]#{b:pane_current_path} #[fg=#d3c6a1]|#[fg=#e9e2d4] %H:%M "

# Windows
set -g window-status-format "#[fg=#cec6b4] #I:#W "
set -g window-status-current-format "#[bg=#4f462a,fg=#f0e2bb,bold] #I:#W "
set -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#4b4639"
set -g pane-active-border-style "fg=#e0c56d"
set -g pane-border-format " #[fg=#cec6b4]#{pane_index} #[fg=#979080]#{pane_current_command} "

# Popups, menus (display-menu / which-key), messages
set -g menu-style "bg=#221f17,fg=#e9e2d4"
set -g menu-selected-style "bg=#e0c56d,fg=#3b2f00,bold"
set -g popup-style "bg=#221f17,fg=#e9e2d4"
set -g message-style "bg=#564500,fg=#fde186"
set -g message-command-style "bg=#2d2a21,fg=#e9e2d4"
set -g mode-style "bg=#e0c56d,fg=#3b2f00"
set -g clock-mode-colour "#e0c56d"
set -g display-panes-active-colour "#e0c56d"
set -g display-panes-colour "#4b4639"
