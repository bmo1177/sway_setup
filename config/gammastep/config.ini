; Gammastep (night light) for the HP G10 panel.
; Install via ~/sway-binnewbs-snippet.nix, then it autostarts with sway.
; Toggle anytime: $mod+Ctrl+T (sway-night script).
; Location defaults to Algiers (from system timezone) — adjust if needed.

[general]
temp-day=6500
temp-night=4000
fade=1

[manual]
lat=36.7
lon=3.1
