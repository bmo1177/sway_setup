# Catppuccin Mocha foot theme. Colors (and glass alpha) live in colors.ini
# so matugen can regenerate them from the wallpaper — see
# ~/.config/matugen/config.toml, applied by Super+W (sway-wallpaper).
font=JetBrainsMono Nerd Font:size=12
pad=12x12
include=~/.config/foot/colors.ini

[main]
# Select-to-copy: put selections in the clipboard as well as primary.
selection-target=both

[cursor]
style=beam
blink=yes

[scrollback]
# Default is 1000 lines — far too small for build logs. ~50k ≈ a few MB.
lines=50000

[mouse]
# Cursor gets out of the way while typing.
hide-when-typing=yes

[bell]
# Flag the window (urgency) instead of beeping: audible bell off, long
# builds still draw attention from another workspace.
urgent=yes
system=no
