# Foot — Adwaita Dark palette + JetBrainsMono Nerd Font 11, matching the
# old GNOME Console setup. Colors live in colors.ini and are now fixed
# (matugen no longer regenerates them).
font=JetBrainsMono Nerd Font:size=11
pad=8x8
include=~/.config/foot/colors.ini

[main]
# Select-to-copy sends to the clipboard as well as primary.
selection-target=both
# Keep bold text in the regular palette color (like GNOME Console), so the
# Starship prompt uses the exact cyan/yellow/green from the palette.
bold-text-in-bright=no

[cursor]
style=block
blink=yes

[scrollback]
# Default 1000 lines is too small for build logs.
lines=50000

[mouse]
hide-when-typing=yes

[bell]
urgent=yes
system=no
