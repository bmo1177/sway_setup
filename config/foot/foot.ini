# Catppuccin Mocha foot theme. Colors live in colors.ini so matugen can
# regenerate them from the wallpaper (see ~/.config/matugen/config.toml).
font=JetBrainsMono Nerd Font:size=12
pad=8x8
include=~/.config/foot/colors.ini

[main]
# Select-to-copy sends to the clipboard as well as primary.
selection-target=both

[cursor]
style=beam
blink=yes

[scrollback]
# Default 1000 lines is too small for build logs.
lines=50000

[mouse]
hide-when-typing=yes

[bell]
urgent=yes
system=no
