# tmux theme — generated with Matugen from the current wallpaper.
# Sourced by /etc/tmux.conf (see nixos/sway.nix). Regenerated by Super+W.

# Status bar
set -g status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g status-left-length 40
set -g status-right-length 96
set -g status-left "#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold] #S "
set -g status-right "#[fg={{colors.tertiary.default.hex}}]#{cpu_percentage} #[fg={{colors.outline_variant.default.hex}}]#{b:pane_current_path} #[fg={{colors.secondary.default.hex}}]|#[fg={{colors.on_surface.default.hex}}] %H:%M "

# Windows
set -g window-status-format "#[fg={{colors.on_surface_variant.default.hex}}] #I:#W "
set -g window-status-current-format "#[bg={{colors.secondary_container.default.hex}},fg={{colors.on_secondary_container.default.hex}},bold] #I:#W "
set -g window-status-separator ""

# Panes
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g pane-border-format " #[fg={{colors.on_surface_variant.default.hex}}]#{pane_index} #[fg={{colors.outline.default.hex}}]#{pane_current_command} "

# Popups, menus (display-menu / which-key), messages
set -g menu-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g menu-selected-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"
set -g popup-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"
set -g message-command-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g mode-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}"
set -g clock-mode-colour "{{colors.primary.default.hex}}"
set -g display-panes-active-colour "{{colors.primary.default.hex}}"
set -g display-panes-colour "{{colors.outline_variant.default.hex}}"
