# Starship prompt template (matugen) — NOT wired into config.toml right now.
# The live prompt is the fixed nerd-font-symbols config in
# ~/.config/starship/starship.toml. Kept for reference / easy re-enable.
add_newline = true
palette = "matugen"

format = """
$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"""

[palettes.matugen]
primary = '{{colors.primary.default.hex}}'
on_primary = '{{colors.on_primary.default.hex}}'
secondary = '{{colors.secondary.default.hex}}'
secondary_container = '{{colors.secondary_container.default.hex}}'
tertiary = '{{colors.tertiary.default.hex}}'
error = '{{colors.error.default.hex}}'
surface = '{{colors.surface.default.hex}}'
surface_bright = '{{colors.surface_bright.default.hex}}'
on_surface = '{{colors.on_surface.default.hex}}'
on_surface_variant = '{{colors.on_surface_variant.default.hex}}'
outline_variant = '{{colors.outline_variant.default.hex}}'

[username]
show_always = true
style_user = "fg:secondary"
style_root = "bold fg:error"
format = "[$user](fg:secondary)[@](fg:outline)"

[hostname]
ssh_only = false
format = "[$hostname](fg:tertiary) "

[directory]
style = "fg:primary"
format = "[$path]($style)"
truncation_length = 4

[git_branch]
style = "fg:secondary"
format = "[ $symbol$branch]($style)"

[git_status]
style = "fg:error"
format = "[ $all_status$ahead_behind]($style)"

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:outline_variant"
format = "[ took $duration]($style)"

[character]
success_symbol = "[❯](fg:primary)"
error_symbol = "[❯](fg:error)"
