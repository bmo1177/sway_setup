# Starship prompt — generated with Matugen from the current wallpaper.
# Source: ~/.config/matugen/templates/starship.toml
# Regenerated by Super+W (sway-wallpaper). Do not edit this file directly.
add_newline = true
palette = "matugen"

format = """
$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"""

[palettes.matugen]
primary = '#e0c56d'
on_primary = '#3b2f00'
secondary = '#d3c6a1'
secondary_container = '#4f462a'
tertiary = '#abcfb0'
error = '#ffb4ab'
surface = '#16130b'
surface_bright = '#3d392f'
on_surface = '#e9e2d4'
on_surface_variant = '#cec6b4'
outline_variant = '#4b4639'

[username]
show_always = true
style_user = "fg:secondary"
style_root = "bold fg:error"
format = "[$user](fg:secondary)[@](fg:outline)"

[hostname]
ssh_only = false
format = "[$hostname](fg:tertiary) "

[directory]
style = "fg:primary"
format = "[$path]($style)"
truncation_length = 4

[git_branch]
style = "fg:secondary"
format = "[ $symbol$branch]($style)"

[git_status]
style = "fg:error"
format = "[ $all_status$ahead_behind]($style)"

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:outline_variant"
format = "[ took $duration]($style)"

[character]
success_symbol = "[❯](fg:primary)"
error_symbol = "[❯](fg:error)"
